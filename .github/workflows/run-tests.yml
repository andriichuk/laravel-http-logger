name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit*.xml.dist'
      - 'composer.json'
      - 'composer.laravel-9.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.4, 8.3]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Allow Laravel 11 in the compatibility suite
        if: matrix.laravel == '11.*'
        shell: bash
        run: >-
          composer config --json policy.advisories.ignore
          '{"laravel/framework":{"constraint":"^11.0","on-audit":false,"reason":"Run the Laravel 11 compatibility suite in CI."}}'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  test-laravel-9:
    name: P${{ matrix.php }} - L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPOSER: composer.laravel-9.json
    strategy:
      matrix:
        include:
          - php: '8.0'
            laravel: '9.0.0'
            testbench_core: 7.0.*
          - php: '8.2'
            laravel: 9.52.*
            testbench_core: 7.*

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, fileinfo, gd
          coverage: none
          tools: composer:2.10

      - name: Install dependencies
        run: >-
          composer update --prefer-dist --no-interaction
          --with "laravel/framework:${{ matrix.laravel }}"
          --with "orchestra/testbench-core:${{ matrix.testbench_core }}"

      - name: Execute tests
        run: vendor/bin/pest --configuration phpunit.laravel-9.xml.dist
